# This is a basic workflow to help you get started with Actions

name: build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Secrets are not available to PRs from forks, so skip the build instead of failing on the unzip
  check-secret:
    uses: KSP-RO/BuildTools/.github/workflows/check-secret.yml@master
    secrets:
      KSP_ZIP_PASSWORD: ${{ secrets.KSP_ZIP_PASSWORD }}

  build:
    # The type of runner that the job will run on
    # ubuntu-24.04 (ubuntu-latest) no longer ships Mono/msbuild
    runs-on: ubuntu-22.04
    needs: [check-secret]
    if: needs.check-secret.outputs.has-password == 'true'

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 100
          
      - name: Download required assemblies
        id: download-assemblies
        uses: KSP-RO/BuildTools/download-assemblies@master
        with:
          KSP_ZIP_PASSWORD: ${{ secrets.KSP_ZIP_PASSWORD }}
                    
      - name: Build mod solution
        run: msbuild /p:Configuration=Release /p:ReferencePath="${{ steps.download-assemblies.outputs.ksp-dll-path }}" RSSTimeFormatter.sln

      - name: Remove excess DLLs
        uses: KSP-RO/BuildTools/remove-excess-dlls@master
        with:
          path: ${GITHUB_WORKSPACE}/GameData/

      - name: Assemble release
        id: assemble-release
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/release"
          echo "Release dir: ${RELEASE_DIR}"
          mkdir -v "${RELEASE_DIR}"
          echo "release-dir=${RELEASE_DIR}" >> "$GITHUB_OUTPUT"
          cp -v -R "${GITHUB_WORKSPACE}/GameData" "${RELEASE_DIR}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: RSSDateTimeFormatter
          path: ${{ steps.assemble-release.outputs.release-dir }}
